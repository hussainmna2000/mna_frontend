<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Wall plaster texture filter -->
    <filter id="wallTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.08 0" in="noise" result="alphaNoise" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>

    <!-- Concrete ground texture -->
    <filter id="groundTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0.2 0.2 0.2 0 0  0.2 0.2 0.2 0 0  0.2 0.2 0.2 0 0  0 0 0 0.12 0" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>

    <!-- Realistic Sky Gradient -->
    <linearGradient id="skyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="65%" stop-color="#60a5fa" />
      <stop offset="90%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Cloud Fill -->
    <linearGradient id="cloud1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.3" />
    </linearGradient>

    <!-- Grey Exterior Wall Gradient -->
    <linearGradient id="greyWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#b0bec5" />
    </linearGradient>

    <linearGradient id="darkGreyPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78909c" />
      <stop offset="50%" stop-color="#607d8b" />
      <stop offset="100%" stop-color="#455a64" />
    </linearGradient>

    <!-- Water Tank Cylinder Gradient -->
    <linearGradient id="tankBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Maroon Iron Gate Metallic Gradient -->
    <linearGradient id="gateMaroon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Wooden Ladder Gradient -->
    <linearGradient id="woodLadder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Window Glass Reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="8" dy="16" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gate Shadow -->
    <filter id="gateShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="15" dy="15" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== SKY & ATMOSPHERE ==================== -->
  <rect width="1920" height="1200" fill="url(#skyBlue)" />

  <!-- Natural Fluffy Cloud Formations -->
  <g fill="url(#cloud1)">
    <path d="M 120,220 Q 220,130 360,170 Q 480,110 620,160 Q 740,120 840,200 Q 920,250 820,290 L 100,290 Z" />
    <path d="M 1100,180 Q 1240,90 1400,140 Q 1520,80 1660,130 Q 1780,100 1860,190 L 1050,230 Z" />
    <path d="M 600,100 Q 720,40 850,80 Q 960,30 1080,90 Z" opacity="0.6" />
  </g>

  <!-- Ground Pavement -->
  <polygon points="0,920 1920,920 1920,1200 0,1200" fill="#d1d5db" />
  <polygon points="0,960 1920,960 1920,1200 0,1200" fill="#9ca3af" opacity="0.5" />
  <!-- Interlocking Paving Lines -->
  <path d="M 0,1000 L 1920,1000 M 0,1050 L 1920,1050 M 0,1100 L 1920,1100 M 0,1150 L 1920,1150" stroke="#6b7280" stroke-width="2" stroke-dasharray="30 15" opacity="0.4" />

  <!-- ==================== LEFT HOUSE ==================== -->
  <g filter="url(#softShadow)">
    <!-- Main Outer Parapet Wall (White Border) -->
    <rect x="180" y="320" width="620" height="620" fill="#ffffff" rx="2" />
    <!-- Inner Main Grey Wall -->
    <rect x="200" y="340" width="580" height="600" fill="url(#greyWall)" />
    
    <!-- Dark Grey Decorative Accent Panel (Top-Left) -->
    <rect x="230" y="340" width="220" height="600" fill="url(#darkGreyPanel)" />

    <!-- Architectural Trim Lines & Diagonal Recessed Grooves -->
    <line x1="230" y1="380" x2="780" y2="880" stroke="#ffffff" stroke-width="5" opacity="0.9" />
    <line x1="230" y1="500" x2="780" y2="650" stroke="#90a4ae" stroke-width="3" />
    <line x1="230" y1="720" x2="780" y2="720" stroke="#ffffff" stroke-width="4" />

    <!-- Ground Floor Window -->
    <!-- Window Outer White Surround -->
    <rect x="420" y="680" width="180" height="210" fill="#ffffff" rx="3" filter="url(#softShadow)" />
    <rect x="430" y="690" width="160" height="190" fill="url(#glassReflect)" />
    <!-- Window Security Grills -->
    <line x1="510" y1="690" x2="510" y2="880" stroke="#ffffff" stroke-width="4" />
    <line x1="430" y1="730" x2="590" y2="730" stroke="#94a3b8" stroke-width="3" />
    <line x1="430" y1="770" x2="590" y2="770" stroke="#94a3b8" stroke-width="3" />
    <line x1="430" y1="810" x2="590" y2="810" stroke="#94a3b8" stroke-width="3" />
    <line x1="430" y1="850" x2="590" y2="850" stroke="#94a3b8" stroke-width="3" />
    <!-- Vertical Security Bars -->
    <line x1="460" y1="690" x2="460" y2="880" stroke="#334155" stroke-width="2.5" />
    <line x1="485" y1="690" x2="485" y2="880" stroke="#334155" stroke-width="2.5" />
    <line x1="535" y1="690" x2="535" y2="880" stroke="#334155" stroke-width="2.5" />
    <line x1="560" y1="690" x2="560" y2="880" stroke="#334155" stroke-width="2.5" />
  </g>

  <!-- Left Roof Top Structure -->
  <!-- T-Shaped Clothesline / Antenna Pole -->
  <g stroke="#1e293b" stroke-width="7" stroke-linecap="square">
    <line x1="380" y1="160" x2="380" y2="320" />
    <line x1="300" y1="160" x2="460" y2="160" />
    <!-- Top wire mounts -->
    <circle cx="300" cy="160" r="4" fill="#0f172a" />
    <circle cx="460" cy="160" r="4" fill="#0f172a" />
  </g>

  <!-- Blue Sintex Water Tank (Left Roof) -->
  <g filter="url(#softShadow)">
    <rect x="620" y="240" width="130" height="85" rx="16" fill="url(#tankBlue)" />
    <!-- Tank Horizontal Rib Lines -->
    <line x1="620" y1="265" x2="750" y2="265" stroke="#1d4ed8" stroke-width="3" />
    <line x1="620" y1="290" x2="750" y2="290" stroke="#1d4ed8" stroke-width="3" />
    <!-- Tank Top Cap -->
    <ellipse cx="685" cy="240" rx="65" ry="16" fill="#3b82f6" />
    <ellipse cx="685" cy="232" rx="30" ry="8" fill="#1e40af" />
  </g>

  <!-- ==================== RIGHT HOUSE ==================== -->
  <g filter="url(#softShadow)">
    <!-- Main Outer Parapet Wall (White Border) -->
    <rect x="1120" y="340" width="620" height="600" fill="#ffffff" rx="2" />
    <!-- Inner Main Grey Wall -->
    <rect x="1140" y="360" width="580" height="580" fill="url(#greyWall)" />

    <!-- Dark Grey Decorative Accent Panel (Top-Left) -->
    <rect x="1170" y="360" width="230" height="580" fill="url(#darkGreyPanel)" />

    <!-- Trim & Grooves -->
    <line x1="1170" y1="390" x2="1720" y2="900" stroke="#ffffff" stroke-width="5" opacity="0.9" />
    <line x1="1140" y1="460" x2="1720" y2="460" stroke="#90a4ae" stroke-width="3" />
    <line x1="1140" y1="670" x2="1720" y2="670" stroke="#ffffff" stroke-width="4" />

    <!-- Ground Floor Window -->
    <rect x="1440" y="690" width="180" height="210" fill="#ffffff" rx="3" filter="url(#softShadow)" />
    <rect x="1450" y="700" width="160" height="190" fill="url(#glassReflect)" />
    <!-- Window Security Grills -->
    <line x1="1530" y1="700" x2="1530" y2="890" stroke="#ffffff" stroke-width="4" />
    <line x1="1450" y1="740" x2="1610" y2="740" stroke="#94a3b8" stroke-width="3" />
    <line x1="1450" y1="780" x2="1610" y2="780" stroke="#94a3b8" stroke-width="3" />
    <line x1="1450" y1="820" x2="1610" y2="820" stroke="#94a3b8" stroke-width="3" />
    <line x1="1450" y1="860" x2="1610" y2="860" stroke="#94a3b8" stroke-width="3" />
    <!-- Vertical Security Bars -->
    <line x1="1480" y1="700" x2="1480" y2="890" stroke="#334155" stroke-width="2.5" />
    <line x1="1505" y1="700" x2="1505" y2="890" stroke="#334155" stroke-width="2.5" />
    <line x1="1555" y1="700" x2="1555" y2="890" stroke="#334155" stroke-width="2.5" />
    <line x1="1580" y1="700" x2="1580" y2="890" stroke="#334155" stroke-width="2.5" />
  </g>

  <!-- Right Roof Top Structure -->
  <!-- T-Shaped Clothesline Pole -->
  <g stroke="#1e293b" stroke-width="7" stroke-linecap="square">
    <line x1="1390" y1="180" x2="1390" y2="340" />
    <line x1="1310" y1="180" x2="1470" y2="180" />
    <circle cx="1310" cy="180" r="4" fill="#0f172a" />
    <circle cx="1470" cy="180" r="4" fill="#0f172a" />
  </g>

  <!-- Blue Sintex Water Tank (Right Roof) -->
  <g filter="url(#softShadow)">
    <rect x="1560" y="260" width="130" height="85" rx="16" fill="url(#tankBlue)" />
    <line x1="1560" y1="285" x2="1690" y2="285" stroke="#1d4ed8" stroke-width="3" />
    <line x1="1560" y1="310" x2="1690" y2="310" stroke="#1d4ed8" stroke-width="3" />
    <ellipse cx="1625" cy="260" rx="65" ry="16" fill="#3b82f6" />
    <ellipse cx="1625" cy="252" rx="30" ry="8" fill="#1e40af" />
  </g>

  <!-- ==================== CENTRAL SPIRAL STAIRWAY ==================== -->
  <!-- Middle Gap Wall Shade -->
  <rect x="800" y="480" width="320" height="460" fill="#64748b" opacity="0.9" />

  <g stroke="#0f172a" fill="none">
    <!-- Center Steel Column -->
    <line x1="960" y1="460" x2="960" y2="940" stroke="#0f172a" stroke-width="12" />

    <!-- Spiral Treads -->
    <path d="M 960,500 C 1030,480 1060,520 960,540" fill="#1e293b" stroke="#020617" stroke-width="4" />
    <path d="M 960,540 C 890,560 870,600 960,610" fill="#1e293b" stroke="#020617" stroke-width="4" />
    <path d="M 960,610 C 1040,630 1070,670 960,690" fill="#1e293b" stroke="#020617" stroke-width="4" />
    <path d="M 960,690 C 880,710 860,750 960,770" fill="#1e293b" stroke="#020617" stroke-width="4" />
    <path d="M 960,770 C 1050,790 1070,830 960,850" fill="#1e293b" stroke="#020617" stroke-width="4" />
    <path d="M 960,850 C 870,870 850,910 960,930" fill="#1e293b" stroke="#020617" stroke-width="4" />

    <!-- Outer Handrail Curve -->
    <path d="M 960,460 Q 1080,530 960,610 Q 840,690 960,770 Q 1080,850 960,940" stroke="#0f172a" stroke-width="7" />
  </g>

  <!-- ==================== FRONT RED/MAROON SLAT GATES ==================== -->
  <!-- Left Gate (Swing open style) -->
  <g filter="url(#gateShadow)">
    <!-- Gate Pillar Base -->
    <rect x="300" y="810" width="30" height="230" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <!-- Gate Main Frame -->
    <rect x="330" y="820" width="290" height="220" fill="url(#gateMaroon)" stroke="#450a0a" stroke-width="5" rx="4" />
    <!-- Vertical Iron Slats -->
    <line x1="360" y1="820" x2="360" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="390" y1="820" x2="390" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="420" y1="820" x2="420" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="450" y1="820" x2="450" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="480" y1="820" x2="480" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="510" y1="820" x2="510" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="540" y1="820" x2="540" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="570" y1="820" x2="570" y2="1040" stroke="#7f1d1d" stroke-width="6" />
    <line x1="600" y1="820" x2="600" y2="1040" stroke="#7f1d1d" stroke-width="6" />

    <!-- Gate Horizontal Braces -->
    <line x1="330" y1="880" x2="620" y2="880" stroke="#dc2626" stroke-width="6" />
    <line x1="330" y1="980" x2="620" y2="980" stroke="#dc2626" stroke-width="6" />
  </g>

  <!-- Right Gate (Swing open style) -->
  <g filter="url(#gateShadow)">
    <rect x="960" y="830" width="300" height="220" fill="url(#gateMaroon)" stroke="#450a0a" stroke-width="5" rx="4" />
    <rect x="1260" y="820" width="30" height="230" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <!-- Vertical Slats -->
    <line x1="990" y1="830" x2="990" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1020" y1="830" x2="1020" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1050" y1="830" x2="1050" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1080" y1="830" x2="1080" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1110" y1="830" x2="1110" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1140" y1="830" x2="1140" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1170" y1="830" x2="1170" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1200" y1="830" x2="1200" y2="1050" stroke="#7f1d1d" stroke-width="6" />
    <line x1="1230" y1="830" x2="1230" y2="1050" stroke="#7f1d1d" stroke-width="6" />

    <line x1="960" y1="890" x2="1260" y2="890" stroke="#dc2626" stroke-width="6" />
    <line x1="960" y1="990" x2="1260" y2="990" stroke="#dc2626" stroke-width="6" />
  </g>

  <!-- ==================== WOODEN LADDER LEANING ON RIGHT HOUSE ==================== -->
  <g transform="rotate(11 1680 750)" filter="url(#softShadow)">
    <!-- Wooden Rails -->
    <line x1="1660" y1="580" x2="1660" y2="1100" stroke="url(#woodLadder)" stroke-width="12" stroke-linecap="round" />
    <line x1="1730" y1="580" x2="1730" y2="1100" stroke="url(#woodLadder)" stroke-width="12" stroke-linecap="round" />
    <!-- Ladder Wooden Rungs -->
    <line x1="1660" y1="630" x2="1730" y2="630" stroke="#78350f" stroke-width="7" />
    <line x1="1660" y1="690" x2="1730" y2="690" stroke="#78350f" stroke-width="7" />
    <line x1="1660" y1="750" x2="1730" y2="750" stroke="#78350f" stroke-width="7" />
    <line x1="1660" y1="810" x2="1730" y2="810" stroke="#78350f" stroke-width="7" />
    <line x1="1660" y1="870" x2="1730" y2="870" stroke="#78350f" stroke-width="7" />
    <line x1="1660" y1="930" x2="1730" y2="930" stroke="#78350f" stroke-width="7" />
    <line x1="1660" y1="990" x2="1730" y2="990" stroke="#78350f" stroke-width="7" />
    <line x1="1660" y1="1050" x2="1730" y2="1050" stroke="#78350f" stroke-width="7" />
  </g>

  <!-- High-end lighting overlay for rich contrast -->
  <linearGradient id="sunShine" x1="100%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
  </linearGradient>
  <rect width="1920" height="1200" fill="url(#sunShine)" pointer-events="none" />
</svg>
